name: Extract Prudential Promotions

on:
  workflow_dispatch:

  schedule:
    # 00:00 UTC
    # = 08:00 Singapore Time
    - cron: "0 0 * * *"

permissions:
  contents: write

concurrency:
  group: prudential-promotions-extractor
  cancel-in-progress: false

jobs:
  extract:
    name: Extract Promotions
    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ======================================================
      # PYTHON
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # ======================================================
      # DEPENDENCIES
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      # ======================================================
      # EXTRACT
      # ======================================================

      - name: Extract Prudential promotions
        run: |
          python -u scripts/extract_promotions.py

      # ======================================================
      # CHECK OUTPUT
      # ======================================================

      - name: Validate output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/promotions.json")

          if not path.exists():
              raise SystemExit(
                  "ERROR: data/promotions.json was not created."
              )

          with path.open(
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          required = [
              "schemaVersion",
              "source",
              "retrievedDate",
              "retrievedTimestamp",
              "promotionCount",
              "promotions",
          ]

          for key in required:
              if key not in data:
                  raise SystemExit(
                      f"ERROR: Missing JSON field: {key}"
                  )

          if not isinstance(
              data["promotions"],
              list
          ):
              raise SystemExit(
                  "ERROR: promotions must be an array."
              )

          print(
              f"Validated {len(data['promotions'])} "
              "promotion records."
          )
          PY

      # ======================================================
      # COMMIT
      # ======================================================

      - name: Commit updated promotions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/promotions.json

          if git diff --cached --quiet; then
            echo "No promotion changes detected."
            exit 0
          fi

          git commit \
            -m "Update Prudential promotions"

          git push
