name: Market News - AI Analysis

on:
  workflow_dispatch:

  workflow_run:
    workflows:
      - "Market News - CNBC Collector"
    types:
      - completed

permissions:
  contents: write

jobs:
  analyze-market-news:
    name: Analyze Market News

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip

          if [ -f scripts/requirements.txt ]; then
            pip install -r scripts/requirements.txt
          fi

      - name: Wait 15 minutes after collector
        if: github.event_name == 'workflow_run'
        run: |
          echo "Market News - CNBC Collector completed successfully."
          echo "Waiting 15 minutes before AI analysis..."
          sleep 900
          echo "15-minute wait completed."

      - name: Analyze market news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MARKET_NEWS_MODEL: gemini-3.5-flash-lite
        run: |
          python -u scripts/analyze_market_news.py

      - name: Commit analysis results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ ! -d data/market_news/analysis ]; then
            echo "No analysis folder."
            exit 0
          fi

          # Keep this run's results aside. Only this workflow writes analysis/,
          # so they can be laid over the newest main if another workflow pushed first.
          rm -rf "$RUNNER_TEMP/analysis"
          cp -r data/market_news/analysis "$RUNNER_TEMP/analysis"

          MAX_ATTEMPTS=5
          ATTEMPT=1
          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            echo "Publish attempt $ATTEMPT / $MAX_ATTEMPTS"

            git fetch origin main
            git reset --hard origin/main

            rm -rf data/market_news/analysis
            mkdir -p data/market_news
            cp -r "$RUNNER_TEMP/analysis" data/market_news/analysis
            git add -A data/market_news/analysis/

            if git diff --cached --quiet; then
              echo "No analysis changes to commit."
              exit 0
            fi

            git commit -m "Update market news AI analysis"

            if git push origin HEAD:main; then
              echo "Pushed."
              exit 0
            fi

            echo "Push rejected (another workflow pushed first); retrying..."
            ATTEMPT=$((ATTEMPT + 1))
            sleep $((ATTEMPT * 5))
          done

          echo "Could not push after $MAX_ATTEMPTS attempts."
          exit 1
