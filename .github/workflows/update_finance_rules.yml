name: Update Finance Rules

# ============================================================
# Keeps data/finance_rules.json (the Financial Calculator's
# reference data) up to date from official sources:
#   data.gov.sg (CPF contribution / allocation rates, wage
#   ceiling, Full Retirement Sum), cpf.gov.sg (CPF interest
#   rates, HDB loan rate, Basic Healthcare Sum) and iras.gov.sg
#   (Buyer's Stamp Duty).
#
# Runs every day at 7:41 AM Singapore time (23:41 UTC). The file
# is committed only when a value changes, or once a week to
# record that the sources were checked.
# ============================================================

on:
  schedule:
    - cron: "41 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-finance-rules
  cancel-in-progress: false

jobs:
  update-finance-rules:
    name: Read official sources -> data/finance_rules.json
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests and Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install "requests==2.32.5" "playwright==1.55.0"
          python -m playwright install --with-deps chromium

      - name: Update the reference data
        run: python scripts/update_finance_rules.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/finance_rules.json; then
            echo "Reference data unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/finance_rules.json
          git commit -m "Update Financial Calculator reference data"

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Pushed."
              exit 0
            fi
            echo "Push failed (attempt $attempt). Rebasing on the latest main..."
            git pull --rebase origin main || git rebase --abort
            sleep 5
          done

          echo "::error::Could not push the reference data after 5 attempts."
          exit 1
