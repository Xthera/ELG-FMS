name: Prudential All Funds Basic Info

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-prudential:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Install Chromium
        run: |
          playwright install --with-deps chromium

      - name: Run Prudential all-fund JSON capture
        run: |
          python -u scripts/test_prudential_fund.py

      - name: Show Prudential JSON results
        if: always()
        run: |
          echo "=== Prudential JSON output ==="
          if [ -d "output_prudential_json" ]; then
            find output_prudential_json -type f -print
          else
            echo "output_prudential_json directory does not exist."
          fi

      - name: Upload Prudential JSON results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prudential-json-output
          path: output_prudential_json/
          if-no-files-found: warn
